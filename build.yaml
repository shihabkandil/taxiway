targets:
  $default:
    builders:
      json_serializable:
        options:
          # Nested models must serialise through their own toJson, otherwise a
          # config round-trips into a map holding live objects.
          explicit_to_json: true
          any_map: true
          checked: true
          create_to_json: true
          disallow_unrecognized_keys: true
          include_if_null: false
