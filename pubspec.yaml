name: shipway
description: A local-first Flutter CI/CD file generator and runner. Scaffolds flavors, generates and invokes fastlane, and ships to TestFlight, the App Store, Play tracks and Firebase from your laptop.
version: 0.1.0-dev
repository: https://github.com/shihabkandil/shipway

environment:
  sdk: ^3.8.0

executables:
  shipway: shipway

dependencies:
  args: ^2.7.0
  checked_yaml: ^2.0.4
  cli_completion: ^0.6.0
  collection: ^1.19.1
  crypto: ^3.0.7
  json_annotation: ^4.12.0
  json_schema: ^5.2.2
  mason_logger: ^0.3.5
  meta: ^1.19.0
  path: ^1.9.1
  pub_updater: ^0.6.0
  pubspec_parse: ^1.6.0
  xml: ^6.5.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.4.13
  json_serializable: ^6.14.1
  lints: ^5.1.1
  mocktail: ^1.0.5
  test: ^1.32.0
